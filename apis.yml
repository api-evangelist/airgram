aid: airgram
name: Airgram
description: >-
  Airgram was a Singapore-headquartered AI meeting assistant founded in 2020 by Ryan Zhang. Its
  web app joined Zoom, Google Meet and Microsoft Teams calls to record and transcribe them in real
  time, then produced collaborative notes, agendas, action items, AI summaries and shareable clips,
  with exports to Notion, Slack and HubSpot and an automation connector listed on Zapier. It sold
  the product to end users on free and paid plans and never published a public developer program:
  no API reference, OpenAPI, SDK, webhook catalog or developer portal was ever offered, and the
  Zapier connector was the only integration surface. In early 2024 Airgram merged into Notta
  (notta.ai), the AI transcription company, and the Airgram service was discontinued from
  8 March 2024; Notta hosts a "Airgram Has Joined Notta" welcome page and the LinkedIn company
  page is renamed "Airgram (merged into Notta)". No first-party host survives — airgram.io and
  www.airgram.io have no DNS record and airgram.com 301s into the dead www.airgram.io — so no
  Website pointer is wired. This record is retained as an honest zero: an end-user software
  company, absorbed into an acquirer, with no API surface to profile.
